# Settings contributed by the app-focus module to `dotfiles-settings`.
# Contract: modules/<id>/settings.yaml, kind SettingsFragment. Entries use the
# same schema as modules/settings/registry.yaml and are merged at runtime when
# the module's `enabled` flag (under `dataKey`) is not false.
apiVersion: dotfiles/v1
kind: SettingsFragment
schemaVersion: 1
module: app-focus
dataKey: modules.appFocus
settings:
  - key: app-focus.zenBlockedSlots
    description: Space-separated alt-N slots that zen mode blocks (see hotkeys zen)
    dataPath: modules.appFocus.zenBlockedSlots
    file: home/.chezmoidata/10-modules.yaml
    type: string
    values:
      enum: ["3 4 5", "3 4", "4 5", "3", "4", "5", "1 2 3 4 5"]
    bridges:
      - home/dot_config/app-focus/config.toml.tmpl
    reload: []

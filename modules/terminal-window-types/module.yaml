apiVersion: dotfiles/v1
kind: Module
id: terminal-window-types
version: 1.1.0
description: Provides typed terminal, Codex, Neovim, Tuxedo, and Awrit tmux windows and their terminal-facing controls.
dataKey: modules.terminalWindowTypes
distribution:
  standalone: true
requires:
  executables:
    - bash
    - tmux
    - codex
    - nvim
    - todo
    - awrit
  libraries:
    - core.sh
    - tmux.sh
state:
  preserved: []
  ephemeral:
    - 'tmux-wait-channel:dotfiles-tmux-template-*'
commands:
  - name: tmux-session-template
    source: bin/tmux-session-template
    target: ~/bin/tmux-session-template
    bridge: home/bin/executable_tmux-session-template.tmpl
targets:
  - service: command
    source: bin/tmux-session-template
    destination: ~/bin/tmux-session-template
    bridge: home/bin/executable_tmux-session-template.tmpl
    ownership: exclusive
  - service: command
    source: targets/awrit-path.tmpl
    destination: ~/bin/awrit
    bridge: home/bin/symlink_awrit.tmpl
    ownership: exclusive
  - service: tmux
    source: targets/tmux.conf.tmpl
    destination: ~/.tmux.conf
    bridge: home/dot_tmux.conf.tmpl
    ownership: contribution
  - service: tmux
    source: targets/tmux-status.conf.tmpl
    destination: ~/.tmux.conf
    bridge: home/dot_tmux.conf.tmpl
    ownership: contribution
  - service: tmux-resurrect
    source: targets/tmux-resurrect-process.tmpl
    destination: ~/.tmux.conf
    bridge: home/dot_tmux.conf.tmpl
    ownership: contribution
  - service: ghostty
    source: targets/ghostty.conf.tmpl
    destination: ~/Library/Application Support/com.mitchellh.ghostty/config
    bridge: home/Library/Application Support/com.mitchellh.ghostty/config.tmpl
    ownership: contribution
  - service: skhd
    source: targets/skhdrc.tmpl
    destination: ~/.skhdrc
    bridge: home/dot_skhdrc.tmpl
    ownership: contribution
  - service: tmux-which-key
    source: targets/tmux-which-key-cycle.yaml.tmpl
    destination: ~/.config/tmux/which-key.yaml
    bridge: home/dot_config/tmux/which-key.yaml.tmpl
    ownership: contribution
  - service: tmux-which-key
    source: targets/tmux-which-key-new.yaml.tmpl
    destination: ~/.config/tmux/which-key.yaml
    bridge: home/dot_config/tmux/which-key.yaml.tmpl
    ownership: contribution
  - service: tmux-which-key
    source: targets/tmux-which-key-duplicate.yaml.tmpl
    destination: ~/.config/tmux/which-key.yaml
    bridge: home/dot_config/tmux/which-key.yaml.tmpl
    ownership: contribution
  - service: tmux-which-key
    source: targets/tmux-which-key-rename.yaml.tmpl
    destination: ~/.config/tmux/which-key.yaml
    bridge: home/dot_config/tmux/which-key.yaml.tmpl
    ownership: contribution
tests:
  - tests/test_module.sh
  - tests/test_tmux_session_template.sh

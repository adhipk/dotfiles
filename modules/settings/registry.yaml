# Declarative catalog of every preference `dotfiles-settings` can change.
#
# Each entry maps a public key to a chezmoi data path, the source-state
# bridges that render it, and the services to reload after a change.
# `values` constrains input: a static `enum`, or a `provider` with optional
# `candidates` and `freeText: true` to accept values outside the provider.
apiVersion: dotfiles/v1
kind: SettingsRegistry
schemaVersion: 1
settings:
  - key: editor.terminal
    description: Terminal text editor ($EDITOR and the nvim tmux window command)
    dataPath: preferences.terminalEditor
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: path-commands
      candidates: [nvim, vim, hx, vi]
      freeText: true
    bridges:
      - home/dot_zshrc.tmpl
      - home/dot_config/dotfiles/preferences.toml.tmpl
    reload: []
  - key: editor.gui
    description: macOS editor app focused by the @editor hotkey slot
    dataPath: preferences.guiEditor
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: macos-apps
      freeText: true
    bridges:
      - home/dot_config/app-focus/config.toml.tmpl
    reload: []
  - key: assistant
    description: Agent CLI run by the stable codex tmux window type
    dataPath: preferences.assistant
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: path-commands
      candidates: [hermes, codex, claude, opencode, hermes-dotfiles]
      freeText: true
    bridges:
      - home/dot_config/dotfiles/preferences.toml.tmpl
    reload: []
  - key: terminal.app
    description: Terminal app used by app-focus and the alt-backtick hotkey
    dataPath: preferences.terminalApp
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: macos-apps
      freeText: true
    bridges:
      - home/dot_config/app-focus/config.toml.tmpl
      - home/dot_config/dotfiles/preferences.toml.tmpl
      - home/dot_skhdrc.tmpl
    reload: [skhd]
    regenerate: [shortcuts]
  - key: hotkeys.slot1
    description: App focused by alt-1 (@browser resolves the macOS default browser)
    dataPath: preferences.appSlots.slot1
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: macos-apps
      extra: ["@browser", "@editor"]
      freeText: true
    bridges:
      - home/dot_skhdrc.tmpl
    reload: [skhd]
    regenerate: [shortcuts]
  - key: hotkeys.slot2
    description: App focused by alt-2 (@editor resolves the configured GUI editor)
    dataPath: preferences.appSlots.slot2
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: macos-apps
      extra: ["@browser", "@editor"]
      freeText: true
    bridges:
      - home/dot_skhdrc.tmpl
    reload: [skhd]
    regenerate: [shortcuts]
  - key: hotkeys.slot3
    description: App focused by alt-3
    dataPath: preferences.appSlots.slot3
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: macos-apps
      extra: ["@browser", "@editor"]
      freeText: true
    bridges:
      - home/dot_skhdrc.tmpl
    reload: [skhd]
    regenerate: [shortcuts]
  - key: hotkeys.slot4
    description: App focused by alt-4
    dataPath: preferences.appSlots.slot4
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: macos-apps
      extra: ["@browser", "@editor"]
      freeText: true
    bridges:
      - home/dot_skhdrc.tmpl
    reload: [skhd]
    regenerate: [shortcuts]
  - key: theme.tmuxFlavor
    description: Catppuccin flavor for the tmux status line
    dataPath: preferences.theme.tmuxFlavor
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      enum: [mocha, macchiato, frappe, latte]
    bridges:
      - home/dot_tmux.conf.tmpl
    reload: [tmux]
  - key: theme.colorscheme
    description: Shared terminal colorscheme sourced from ~/.config/colorschemes
    dataPath: preferences.theme.colorscheme
    file: home/.chezmoidata/20-preferences.yaml
    type: string
    values:
      provider: colorschemes
    bridges:
      - home/dot_config/colorschemes/symlink_colors.sh.tmpl
    reload: [colors]

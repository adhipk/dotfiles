<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — {{PROJECT}}</title>
  <link rel="stylesheet" href="shared/hyperspace.css">
</head>
<body data-project="{{PROJECT}}" data-agent="{{AGENT}}" data-updated="{{ISO8601}}">
  <header>
    <h1>{{TITLE}}</h1>
    <p class="meta">
      Project: <strong>{{PROJECT}}</strong> ·
      Agent: <strong>{{AGENT}}</strong> ·
      Updated: <time datetime="{{ISO8601}}">{{TIMESTAMP}}</time>
    </p>
  </header>
  <main id="content">
    <p>{{CONTENT_PLACEHOLDER}}</p>
  </main>
  <footer>
    <code>.hyperspace/</code> · <code>hyperspace-open-report &lt;slug&gt;</code>
  </footer>
</body>
</html>

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix


# Non-templated sessions keep tmux's one-based starting index. The standard
# session helper below pins terminal/codex/nvim/tuxedo to 0/1/2/3.
set -g base-index 1
# don't rename windows automatically
set-option -g allow-rename off
# Keep clients inside tmux when a session is closed; tmux moves each client to
# its own most recently used surviving session instead of detaching it.
set-option -g detach-on-destroy off

# Give ordinary new sessions the same 0/1/2/3 layout as the terminal scratchpads.
# The helper skips command sessions, grouped sessions, hs-* sessions, and explicit
# DOTFILES_TMUX_TEMPLATE=skip opt-outs.
set-hook -g after-new-session[50] 'run-shell "$HOME/bin/tmux-session-template auto #{q:session_name}"'

# Toggle one Yazi side pane or open Yazi in its own full tmux window. Both start
# in the active pane's directory; repeated side-pane toggles never duplicate it.
bind-key -N "Toggle Yazi side pane" b run-shell "$HOME/bin/tmux-yazi-pane toggle '#{pane_id}'"
bind-key -N "Open Yazi full window" B new-window -S -n yazi -c "#{pane_current_path}" yazi

# Keep explicit lifecycle actions in tmux's Control-prefix namespace. Ghostty
# exposes only a few app-local Command adapters; Hyper stays reserved.
bind-key -N "Open sesh session picker" s display-popup -EE -w 70% -h 70% -d "#{pane_current_path}" -T "sesh" "$HOME/bin/tmux-sessionizer-zoxide"
bind-key -N "Switch to client-local last session" L switch-client -l
bind-key -N "New named session" N command-prompt -p "New session:" { new-session -A -s "%%" -c "#{pane_current_path}" }
bind-key -N "Rename session contextually" '$' command-prompt -F -l -p "Rename #S · #{b:pane_current_path}:" -I '#{?#{m/r:^[0-9]+$,#S},#{s|[-_]+| |:#{b:pane_current_path}},#S}' 'rename-session -t "#{session_id}" -- "%%%"'
bind-key -N "Close session" X confirm-before -p "Close session #S? (y/n)" { kill-session -t "#{session_id}" }
bind-key -N "New terminal window" c run-shell "$HOME/bin/tmux-session-template new '#{session_id}' terminal '#{pane_id}'"
bind-key -N "Previous window" p previous-window
bind-key -N "Next window" n next-window
bind-key -N "Close window" '&' confirm-before -p "Close window #W? (y/n)" kill-window
bind-key -N "Toggle pane zoom" z resize-pane -Z

# Right Command is a deliberately small, Ghostty-only management layer. skhd
# translates these four sided-modifier chords to F16-F19. Terminal protocols
# expose those as Shift+F4 through Shift+F7 to tmux; ordinary Command shortcuts
# and every other application keep their native behavior.
bind-key -n -N "Duplicate current window" S-F4 run-shell "$HOME/bin/tmux-session-template duplicate '#{session_id}' '#{pane_id}'"
bind-key -n -N "Rename current window" S-F5 command-prompt -p "Rename window:" -I '#{?#{||:#{==:#{@dotfiles_window_type},codex},#{==:#W,codex}},#T,#W}' { rename-window "%%" }
bind-key -n -N "Open sesh session picker" S-F6 display-popup -EE -w 70% -h 70% -d "#{pane_current_path}" -T "sesh" "$HOME/bin/tmux-sessionizer-zoxide"
bind-key -n -N "Open tmux command center" S-F7 run-shell -C "show-wk-menu-root"

# Treat the standard 0/1/2/3 slots as window types. Control cycles matching
# windows; Control+Shift creates another type in the current pane's directory.
bind-key -n -N "Cycle terminal windows" C-0 run-shell "$HOME/bin/tmux-session-template cycle '#{session_id}' terminal '#{window_id}'"
bind-key -n -N "Cycle Codex windows" C-1 run-shell "$HOME/bin/tmux-session-template cycle '#{session_id}' codex '#{window_id}'"
bind-key -n -N "Cycle Neovim windows" C-2 run-shell "$HOME/bin/tmux-session-template cycle '#{session_id}' nvim '#{window_id}'"
bind-key -n -N "Cycle Tuxedo windows" C-3 run-shell "$HOME/bin/tmux-session-template cycle '#{session_id}' tuxedo '#{window_id}'"
bind-key -n -N "New terminal window" C-S-0 run-shell "$HOME/bin/tmux-session-template new '#{session_id}' terminal '#{pane_id}'"
bind-key -n -N "New Codex window" C-S-1 run-shell "$HOME/bin/tmux-session-template new '#{session_id}' codex '#{pane_id}'"
bind-key -n -N "New Neovim window" C-S-2 run-shell "$HOME/bin/tmux-session-template new '#{session_id}' nvim '#{pane_id}'"
bind-key -n -N "New Tuxedo window" C-S-3 run-shell "$HOME/bin/tmux-session-template new '#{session_id}' tuxedo '#{pane_id}'"
# Higher numbers retain direct index switching.
bind-key -n C-4 select-window -t :4
bind-key -n C-5 select-window -t :5
bind-key -n C-6 select-window -t :6
bind-key -n C-7 select-window -t :7
bind-key -n C-8 select-window -t :8
bind-key -n C-9 select-window -t :9
# Rename Codex windows from their application title; other windows keep the
# usual current-name default. This makes duplicate Codex tabs easy to label.
bind-key , command-prompt -I '#{?#{||:#{==:#{@dotfiles_window_type},codex},#{==:#W,codex}},#T,#W}' { rename-window "%%" }
# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g @plugin 'catppuccin/tmux#v2.3.0' # See https://github.com/catppuccin/tmux/tags for additional tags
# install.sh links the repo-owned command-center YAML into this plugin checkout.
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
# Continuum stays last so its periodic save hook sees every other plugin.
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'

# Direct pane controls mirror the command center and preserve the active cwd.
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Vi-style copy mode integrates with the macOS clipboard without another plugin.
setw -g mode-keys vi
set -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Save in the background and restore the last server state on a cold start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'codex tuxedo yazi'
# Resurrect does not persist custom tmux options, so keep workspace identity in
# a small sidecar and restore it after panes exist but before processes restart.
set -g @resurrect-hook-post-save-all '$HOME/bin/tmux-workspace snapshot save'
set -g @resurrect-hook-pre-restore-pane-processes '$HOME/bin/tmux-workspace snapshot restore'

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Keep Catppuccin's colors, but use a quiet status line that blends into Ghostty.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"

# Catppuccin loads through TPM at the bottom of this file.

# Give each session a clear accent without restoring the rounded status modules.
# The two scratchpad sessions keep stable colors; other sessions rotate through
# the remaining palette by their server-local tmux ID.
set -g @dotfiles_status_accent '#{?#{==:#{session_name},dotfiles},#{@thm_mauve},#{==:#{session_name},projects},#{@thm_sapphire},#{==:#{e|m:#{s|^[$]||:session_id},8},0},#{@thm_green},#{==:#{e|m:#{s|^[$]||:session_id},8},1},#{@thm_peach},#{==:#{e|m:#{s|^[$]||:session_id},8},2},#{@thm_blue},#{==:#{e|m:#{s|^[$]||:session_id},8},3},#{@thm_teal},#{==:#{e|m:#{s|^[$]||:session_id},8},4},#{@thm_yellow},#{==:#{e|m:#{s|^[$]||:session_id},8},5},#{@thm_pink},#{==:#{e|m:#{s|^[$]||:session_id},8},6},#{@thm_lavender},#{@thm_sky}}'

# Keep normal focused Ghostty borders in sync with the active session. The
# helper reapplies transparent per-window overrides after each update so
# scratchpads stay borderless without affecting ordinary Ghostty windows.
set -g focus-events on
set-hook -g client-attached[60] 'run-shell -b "$HOME/bin/tmux-border-accent update"'
set-hook -g client-detached[60] 'run-shell -b "$HOME/bin/tmux-border-accent update"'
set-hook -g client-focus-in[60] 'run-shell -b "$HOME/bin/tmux-border-accent update"'
set-hook -g client-focus-out[60] 'run-shell -b "$HOME/bin/tmux-border-accent update"'
set-hook -g client-session-changed[60] 'run-shell -b "$HOME/bin/tmux-border-accent update"'
set-hook -g after-rename-session[60] 'run-shell -b "$HOME/bin/tmux-border-accent update"'

# Minimal bottom bar: session/context at left, stable app labels in the center.
# The terminal window remains named "terminal" internally so helpers and
# shortcuts keep working; only its displayed label is shortened to "~". When
# a generated numeric session has not been renamed, show its folder instead;
# when a named session already matches its folder, do not repeat it.
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style default
set -g status-left-length 50
set -g status-left '#[fg=#{E:@dotfiles_status_accent},bold]▌ #{?#{m/r:^[0-9]+$,#S},#{b:pane_current_path},#S}#[fg=#{@thm_surface_2},nobold]#{?#{||:#{m/r:^[0-9]+$,#S},#{==:#S,#{b:pane_current_path}}},, · }#[fg=#{@thm_overlay_0}]#{?#{||:#{m/r:^[0-9]+$,#S},#{==:#S,#{b:pane_current_path}}},,#{b:pane_current_path}}'
set -g status-right-length 0
set -g status-right ''
set -g window-status-separator '#[fg=#{@thm_surface_1},nobold]  ·  '
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
set -g window-status-format '#[fg=#{@thm_overlay_0},nobold]#{?#{==:#W,terminal},~,#W}#[default]'
set -g window-status-current-format '#[fg=#{E:@dotfiles_status_accent},bold]#{?#{==:#W,terminal},~,#W}#[default]'



# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ============================================================
# tmux configuration
# ============================================================

# Source colorscheme
source-file ~/.config/tmux/colors.conf

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Change prefix from C-b to C-a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Fast escape time, but NOT 0 — a 0ms timeout makes tmux misread Alt/Meta
# keybindings as a bare Escape when input arrives in separate chunks (e.g.
# while tailing a busy log or inside a redrawing TUI). 10ms is imperceptible
# for vim/neovim's Escape yet reliably forms Meta combos.
set -sg escape-time 10

# Focus events enabled for terminals that support them
set -g focus-events on

# ============================================================
# Key bindings (prefix-based + minimal custom)
# ============================================================

# Keep prefix for compatibility
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Also keep prefix versions for compatibility
unbind '"'
unbind %

# ============================================================
# Status bar
# ============================================================

set -g status-position bottom
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# Update status bar every second
set -g status-interval 1

# Status bar content (colors defined in colors.conf)
set -g status-left "#[fg=#313244,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]"
set -g status-right "#[fg=#313244,bg=#1e1e2e] %Y-%m-%d #[fg=#313244,bg=#cba6f7] %H:%M:%S "

# Window status
setw -g window-status-format "#[fg=#cdd6f4,bg=#313244] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W "

# ============================================================
# Copy mode (vi-style)
# ============================================================

setw -g mode-keys vi

# Enter copy mode with prefix + [
bind [ copy-mode

# Vi-style selection in copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Paste with prefix + ]
bind ] paste-buffer

# ============================================================
# Appearance
# ============================================================

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

# Clock mode
setw -g clock-mode-colour "#89b4fa"

# ============================================================
# Nearly-headless / hyperspace (sesh + tmux agents)
# ============================================================

# Keep sessions alive when the last pane command exits (agent windows)
set -g exit-empty off
# Stay in tmux when a session is destroyed (sesh recommendation)
set -g detach-on-destroy off
# Fast pane kill (sesh recommendation)
bind-key x kill-pane

# Bell → notification for agent windows (monitor-bell set per window by hyperspace)
set -g bell-action any
set -g visual-bell off

set-hook -g pane-died 'run-shell "~/.config/hyperspaces/notify.sh pane-died #{session_name} #{window_name}"'
set-hook -g alert-bell 'run-shell "~/.config/hyperspaces/notify.sh alert-bell #{session_name} #{window_name}"'

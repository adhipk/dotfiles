# tmux colorscheme - Catppuccin Mocha
# Direct hex color values (tmux variables don't expand in config files)

# Status bar
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message text
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

# Window status
setw -g window-status-style "fg=#cdd6f4,bg=#313244"
setw -g window-status-current-style "fg=#1e1e2e,bg=#a6e3a1,bold"
setw -g window-status-activity-style "fg=#f9e2af,bg=#313244"
setw -g window-status-bell-style "fg=#f38ba8,bg=#313244"

# Clock mode
setw -g clock-mode-colour "#89b4fa"

# Copy mode
setw -g mode-style "fg=#cdd6f4,bg=#313244"

#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

# Nearly-headless hyperspace sessions (hs-<project>).
# hyperspace CLI creates these; sesh.toml declares paths and window layouts.

blacklist = ["^daemon-"]

[default_session]
disable_startup_command = true

[[window]]
name = "shell"

[[session]]
name = "hs-dotfiles"
path = "~/dotfiles"
windows = ["shell"]
disable_startup_command = true

[[chromeExtensions]]
name = "gemma-gem"
url = "https://github.com/kessler/gemma-gem.git"
refreshPeriod = "168h"
packageManager = "pnpm"
installCommand = "pnpm install --frozen-lockfile"
buildCommand = "pnpm build"
unpackedPath = ".output/chrome-mv3-dev"

[[externalProjects]]
name = "raycast-lucide-excalidraw"
url = "git@github.com:adhipk/raycast-lucide-excalidraw.git"
refreshPeriod = "168h"
path = ".local/share/raycast-extensions/raycast-lucide-excalidraw"
requiredExecutables = ["npm"]
rerunWhenMissingPaths = [
    "projects/raycast-extension/node_modules",
    "projects/excalidraw-library/library/lucide-icons.excalidrawlib",
]
setupCommands = [
    "npm --prefix projects/raycast-extension ci",
    "npm --prefix projects/excalidraw-library run generate",
]


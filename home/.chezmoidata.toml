# ChezMoi and TPM can clone Git repositories and follow branches/tags, but
# neither natively locks an arbitrary checkout to an immutable commit. These
# declarations are consumed by the dependencies module after each manager has
# installed its repositories. The pin executor refuses dirty tracked files and
# never fetches implicitly.
[[gitPins]]
id = "chezmoi-git:.tmux/plugins/tpm"
manager = "chezmoi"
path = ".tmux/plugins/tpm"
revision = "e261deb1b47614eed3400089ce7197dc68acc4eb"


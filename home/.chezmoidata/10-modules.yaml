dotfiles:
  profile: default
  moduleApiVersion: 1
# Checked-in defaults. Machine-specific overrides may be supplied from the
# `data` section of ~/.config/chezmoi/chezmoi.{toml,yaml,json}.
modules:
  moduleLifecycle:
    enabled: true
  systemUninstall:
    enabled: true
  dependencies:
    enabled: true
  dotfilesControlCenter:
    enabled: true
  settings:
    enabled: true
  shortcutGuide:
    enabled: true
  notifications:
    enabled: true
    backend: auto
    ignoreDnd: true
    sound: none
  appFocus:
    enabled: true
    zenBlockedSlots: "3 4 5"
  windowLayout:
    enabled: true
  appearancePip:
    enabled: true
  spaceDisplay:
    enabled: true
  scratchpads:
    enabled: true
  agentTimer:
    enabled: true
    autoStart: false
    defaultSeconds: 600
    warningSeconds: 60
    reportTimeoutSeconds: 120
    retentionSeconds: 604800
    expirySound: Ping
    preferredAgents:
      - hermes
      - codex
      - claude
      - opencode
  hermesAgent:
    enabled: true
  dotfilesManager:
    enabled: true
  tmuxSessions:
    enabled: true
  tmuxYazi:
    enabled: true
  terminalWindowTypes:
    enabled: true
  kitTts:
    enabled: true
  todo:
    enabled: true
  unescapeCli:
    enabled: true
  ghCreateRepo:
    enabled: true
  macosDefaultApps:
    enabled: true
  qutebrowser:
    enabled: true
  projects:
    enabled: false
  hyperspace:
    enabled: false

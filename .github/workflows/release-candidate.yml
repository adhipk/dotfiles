name: Signed release candidate
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full immutable commit already validated by both CI tiers
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: signed-release-${{ inputs.source_commit }}
  cancel-in-progress: false
jobs:
  candidate:
    name: Signed candidate (${{ matrix.architecture }})
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Validate immutable input
        env:
          CANDIDATE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full commit SHA is required'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - name: Require successful CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.source_commit }}
        run: |
          gh api "$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$CANDIDATE_COMMIT&status=completed&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          run_id="$(python3 -c 'import json,sys; runs=json.load(open(sys.argv[1]))["workflow_runs"]; good=[r for r in runs if r["conclusion"]=="success" and r["head_sha"]==sys.argv[2]]; sys.exit("No successful Validate run for exact commit") if not good else print(good[0]["id"])' "$RUNNER_TEMP/ci-runs.json" "$CANDIDATE_COMMIT")"
          gh run view "$run_id" --json jobs > "$RUNNER_TEMP/ci-jobs.json"
          python3 -c 'import json,sys; jobs=json.load(open(sys.argv[1]))["jobs"]; passed={j["name"] for j in jobs if j["conclusion"]=="success"}; required={"Native app and extension contracts","Existing integration contracts"}; sys.exit("Missing successful CI tiers: " + str(required-passed)) if required-passed else print("Both CI tiers passed")' "$RUNNER_TEMP/ci-jobs.json"
      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
      - name: Native and release gate tests
        run: |
          make test-native
          make test-release-gates
      - name: Import Developer ID into temporary keychain
        env:
          SIGNING_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_P12" && test -n "$SIGNING_PASSWORD"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          echo "::add-mask::$password"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$SIGNING_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Build clean signed candidate
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          test -n "$SIGNING_IDENTITY"
          python3 scripts/build-app.py --sign "$SIGNING_IDENTITY"
          make release-candidate-check
          python3 tests/test_app_bundle.py
      - name: Notarize and staple candidate
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          DOTFILES_NOTARY_PROFILE: candidate-notary
        run: |
          test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM"
          xcrun notarytool store-credentials "$DOTFILES_NOTARY_PROFILE" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM"
          bash scripts/notarize-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dotfiles-signed-${{ matrix.architecture }}-${{ inputs.source_commit }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
            dist/build.json
            dist/notarization.json
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
